<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video → Anki Dictation</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>YouTube / Netflix → Anki</h1>
  <div id="status" class="status">状態を確認中…</div>
  <button id="start" class="primary">録音＋字幕パネル開始</button>
  <button id="panel">字幕パネルを表示・更新</button>
  <button id="stop">録音停止</button>
  <div class="hint">ショートカット: <b>Ctrl + Shift + 9</b>（字幕パネルを現在位置へ）</div>
  <button id="options" class="linkbtn">設定を開く</button>
  <div id="message" class="message"></div>
  <script src="popup.js"></script>
</body>
</html>
